<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g id="sunkeeper-studio-logo">
    <!-- Center Sun Core -->
    <circle cx="400" cy="350" r="90" stroke="#FFD700" stroke-width="16" fill="none" />
    
    <!-- Primary Cardinal Rays (Circuit Tracks) -->
    <!-- Top -->
    <line x1="400" y1="235" x2="400" y2="150" stroke="#FFD700" stroke-width="14" stroke-linecap="round" />
    <circle cx="400" cy="150" r="10" fill="#FFD700" />
    
    <!-- Bottom -->
    <line x1="400" y1="465" x2="400" y2="550" stroke="#FFD700" stroke-width="14" stroke-linecap="round" />
    <circle cx="400" cy="550" r="10" fill="#FFD700" />
    
    <!-- Left -->
    <line x1="285" y1="350" x2="200" y2="350" stroke="#FFD700" stroke-width="14" stroke-linecap="round" />
    <circle cx="200" cy="350" r="10" fill="#FFD700" />
    
    <!-- Right -->
    <line x1="515" y1="350" x2="600" y2="350" stroke="#FFD700" stroke-width="14" stroke-linecap="round" />
    <circle cx="600" cy="350" r="10" fill="#FFD700" />
    
    <!-- Diagonal Tech Circuit Lines -->
    <!-- Top-Right -->
    <path d="M 470 280 L 530 220 L 580 220" stroke="#FFD700" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="580" cy="220" r="9" fill="#FFD700" />
    
    <!-- Bottom-Left -->
    <path d="M 330 420 L 270 480 L 220 480" stroke="#FFD700" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="220" cy="480" r="9" fill="#FFD700" />
    
    <!-- Top-Left -->
    <path d="M 330 280 L 270 220 L 270 170" stroke="#FFD700" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="270" cy="170" r="9" fill="#FFD700" />
    
    <!-- Bottom-Right -->
    <path d="M 470 420 L 530 480 L 530 530" stroke="#FFD700" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="530" cy="530" r="9" fill="#FFD700" />
    
    <!-- Tech Framing Outer Arcs -->
    <path d="M 520 180 A 230 230 0 0 1 620 280" stroke="#FFD700" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M 280 520 A 230 230 0 0 1 180 420" stroke="#FFD700" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Typography -->
    <text x="400" y="670" text-anchor="middle" fill="#FFD700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="38" letter-spacing="8">SUNKEEPER STUDIO</text>
  </g>
</svg>
